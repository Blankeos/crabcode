[workspace]
members = [".", "aisdk"]
resolver = "2"

[package]
name = "crabcode"
version = "0.0.1"
edition = "2021"
description = "(WIP) Rust AI CLI Coding Agent with a beautiful terminal UI"
license = "MIT"
repository = "https://github.com/blankeos/crabcode"
readme = "README.md"
keywords = ["ai", "cli", "coding", "agent", "tui"]
categories = ["command-line-utilities", "development-tools", "api-bindings"]
authors = ["Carlo Taleon <carloantonioct@gmail.com>"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/**/*.rs",
    "/src/**/*.json",
    "/README.md",
    "/LICENSE",
    "/crabcode-logo.txt",
    "/mascot.txt",
    "/sounds/complete.mp3",
    "/sounds/error.mp3",
    "/remote-client/dist/client/**",
]

[dependencies]
ratatui = "0.29"
tui-textarea = { version = "0.7", features = ["ratatui"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
json5 = "0.4"
schemars = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
copypasta = "0.10"
async-trait = "0.1"
futures = "0.3"
dirs = "5.0"
lazy_static = "1.5"
nucleo-matcher = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
cuid2 = "0.1"
chrono = { version = "0.4", features = ["serde"] }
aisdk = { path = "aisdk", version = "0.1.0" }
tokio-util = "0.7"
glob = "0.3"
strsim = "0.11"
thiserror = "1.0"
regex = "1.10"
textwrap = "0.16"
unicode-width = "0.1"
tui-markdown = "0.3"
pulldown-cmark = "0.13"
qrcode = { version = "0.14", default-features = false }
ratatui-core = "0.1"
tiktoken-rs = "0.9.1"
base64 = "0.22"
serde_yaml = "0.9"
sha2 = "0.10"
rand = "0.8"
diff = "0.1"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3.13"
url = "2.5"
shlex = "1.3"
syntect = "5.3"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }

[dev-dependencies]
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
