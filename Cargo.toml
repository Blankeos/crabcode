[package]
name = "crabcode"
version = "0.0.1"
edition = "2021"
description = "(WIP) Rust AI CLI Coding Agent with a beautiful terminal UI"
license = "MIT"
repository = "https://github.com/blankeos/crabcode"
readme = "README.md"
keywords = ["ai", "cli", "coding", "agent", "tui"]
categories = ["command-line-utilities", "development-tools", "api-bindings"]
authors = ["Carlo Taleon <carloantonioct@gmail.com>"]

[dependencies]
ratatui = "0.29"
tui-textarea = { version = "0.7", features = ["ratatui"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
schemars = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
copypasta = "0.10"
async-trait = "0.1"
futures = "0.3"
dirs = "5.0"
lazy_static = "1.5"
nucleo-matcher = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
cuid2 = "0.1"
chrono = { version = "0.4", features = ["serde"] }
aisdk = { version = "0.4", features = ["openai", "openaichatcompletions", "openaicompatible", "anthropic"] }
tokio-util = "0.7"
glob = "0.3"
strsim = "0.11"
thiserror = "1.0"
regex = "1.10"
textwrap = "0.16"
unicode-width = "0.1"
tui-markdown = "0.3"
ratatui-core = "0.1"
tiktoken-rs = "0.9.1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"

[patch.crates-io]
# For local fork development
aisdk = { path = "/Users/carlo/Desktop/Projects/aisdk-rs" }
# After pushing
# aisdk = { git = "https://github.com/Blankeos/aisdk-rs", branch = "crabcode" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
