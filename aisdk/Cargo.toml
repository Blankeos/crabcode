[package]
name = "aisdk"
version = "0.1.0"
edition = "2021"
description = "Minimal LLM SDK for crabcode"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
tokio = { version = "1.40", features = ["sync", "rt", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures = "0.3"
thiserror = "1.0"
eventsource-stream = "0.2"
async-trait = "0.1"
derive_builder = "0.20"
bytes = "1"
